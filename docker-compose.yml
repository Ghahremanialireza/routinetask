services:
  backend:
    build:
      context: ./backend
    image: alirezaghahremani/routinetask-backend:latest
    container_name: routinetask-backend
    ports:
      - "8080:8080"
    environment:
      - DB_PATH=/data/routinetask.db
      - CORS_ALLOWED_ORIGIN=http://localhost:3000
    volumes:
      - db-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    image: alirezaghahremani/routinetask-frontend:latest
    container_name: routinetask-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
